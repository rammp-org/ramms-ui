[CoreRedirects]
; The MeBot is RAMMP Gen1: its mode widget, the mode enum and the robot interface's mode functions were renamed.
; Here, with the plugin, so every project that uses it loads assets saved with the old names. These cover the
; class, the enum, the delegate and calls to the interface functions; a Blueprint that IMPLEMENTS
; RequestMebotMode / GetCurrentMebotMode has its graphs matched by name instead, and needs them renamed by hand.
+ClassRedirects=(OldName="/Script/RammsUI.RammsMebotController",NewName="/Script/RammsUI.RammsRammpGen1Controller")
+EnumRedirects=(OldName="/Script/RammsUI.ERammsMebotMode",NewName="/Script/RammsUI.ERammsRammpGen1Mode")
+FunctionRedirects=(OldName="/Script/RammsUI.RammsRobotController.RequestMebotMode",NewName="RequestRammpGen1Mode")
+FunctionRedirects=(OldName="/Script/RammsUI.RammsRobotController.GetCurrentMebotMode",NewName="GetCurrentRammpGen1Mode")
+FunctionRedirects=(OldName="/Script/RammsUI.RammsMebotController:OnMebotModeChanged__DelegateSignature",NewName="/Script/RammsUI.RammsRammpGen1Controller:OnRammpGen1ModeChanged__DelegateSignature")
